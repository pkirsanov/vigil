openapi: 3.1.0
info:
  title: Agent Data Profiler API
  version: 1.0.0
  description: Technology-neutral control, evidence, manifest, retrieval, and feedback contract.
servers:
  - url: https://profiler.invalid
security:
  - oidc: [profile.read]
paths:
  /sources:
    post:
      operationId: registerSource
      summary: Register an authorized source descriptor.
      security:
        - oidc: [profile.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./source-registration-request.schema.json
      responses:
        '202':
          description: Source accepted and initial profiling queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedRun'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /sources/{sourceId}/runs:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      operationId: startProfilingRun
      summary: Start a full, incremental, resume, or targeted profiling run.
      security:
        - oidc: [profile.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, trigger]
              properties:
                mode: { enum: [full, incremental, resume, targeted] }
                trigger: { enum: [manual, schedule, schema-drift, freshness-gate, trust-gate, usage-drift, method-migration, policy-migration, model-migration] }
                resumeRunId: { type: [string, 'null'], format: uuid }
                fromStage:
                  description: Optional narrowing of the resumable set; it can never mark an incomplete dependency terminal.
                  oneOf:
                    - type: 'null'
                    - enum: [register-negotiate, authorize-pre-read, open-source-boundary, discover-structure, classify-redact, profile-statistics, extract-semantics, validate-identities, generate-relationship-hypotheses, validate-relationships, quality-freshness, lineage-usage, detect-model-patterns, derive-business-model, verify-source-boundary, build-indexes, build-manifests, consumption-probes, publish]
                assetIds: { type: array, minItems: 1, maxItems: 10000, items: { type: string, minLength: 1 } }
              allOf:
                - if:
                    properties:
                      mode: { const: resume }
                  then:
                    required: [resumeRunId]
                    properties:
                      resumeRunId: { type: string, format: uuid }
                - if:
                    properties:
                      mode: { const: targeted }
                  then:
                    required: [assetIds]
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /runs/{runId}:
    get:
      operationId: getProfilingRun
      summary: Get immutable run and stage status.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current run record.
          content:
            application/json:
              schema: { $ref: ./profiling-run.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /runs/{runId}/cancel:
    post:
      operationId: cancelProfilingRun
      summary: Request cancellation of a non-terminal run.
      security:
        - oidc: [profile.write]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '202':
          description: Cancellation accepted idempotently.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: ./cancellation-receipt.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
        '409': { $ref: '#/components/responses/Problem' }
  /sources/{sourceId}/capabilities:
    get:
      operationId: getSourceCapabilities
      summary: Get requested, connector-declared, policy-authorized, and effective capabilities.
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Persisted source descriptor with negotiated capabilities.
          content:
            application/json:
              schema: { $ref: ./source-descriptor.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /sources/{sourceId}/manifests/profile:
    get:
      operationId: getProfileManifest
      summary: Get a version-scoped agent-ready profile manifest.
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/SourceVersion'
        - $ref: '#/components/parameters/ManifestVersion'
      responses:
        '200':
          description: Profile manifest.
          content:
            application/json:
              schema: { $ref: ./profile-manifest.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /sources/{sourceId}/manifests/capabilities:
    get:
      operationId: getCapabilityManifest
      summary: Get a version-scoped analysis-capability manifest.
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/SourceVersion'
        - $ref: '#/components/parameters/ManifestVersion'
      responses:
        '200':
          description: Capability manifest.
          content:
            application/json:
              schema: { $ref: ./capability-manifest.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /sources/{sourceId}/manifests/profile/current:
    get:
      operationId: resolveCurrentProfileManifest
      summary: Resolve the current authorized profile projection; the response includes its immutable manifest version.
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Current profile manifest.
          content:
            application/json:
              schema: { $ref: ./profile-manifest.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /sources/{sourceId}/manifests/capabilities/current:
    get:
      operationId: resolveCurrentCapabilityManifest
      summary: Resolve the current authorized capability projection; the response includes its immutable manifest version.
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Current capability manifest.
          content:
            application/json:
              schema: { $ref: ./capability-manifest.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /sources/{sourceId}/evidence:
    get:
      operationId: listEvidence
      summary: Retrieve evidence by subject, kind, maturity, version, or claim.
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/SourceVersion'
        - { name: assetId, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: maturity, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: continuationToken, in: query, schema: { type: string } }
      responses:
        '200':
          description: Evidence page.
          content:
            application/json:
              schema: { $ref: ./evidence-response.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /evidence/{evidenceId}:
    get:
      operationId: getEvidence
      summary: Get one evidence record after resolving its current authorization scope.
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Evidence record.
          content:
            application/json:
              schema: { $ref: ./evidence-response.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /sources/{sourceId}/retrieve:
    post:
      operationId: retrieveIntelligence
      summary: Retrieve ranked, policy-filtered, version-scoped intelligence for an agent task.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, sourceVersion, manifestVersion, purpose, limit, tokenBudget]
              properties:
                query: { type: string, minLength: 1, maxLength: 4000 }
                sourceVersion: { type: string, minLength: 1 }
                manifestVersion: { type: string, minLength: 1 }
                purpose: { enum: [discovery, planning, query-generation, validation, explanation] }
                limit: { type: integer, minimum: 1, maximum: 100 }
                minimumMaturity:
                  description: Filters by the maturityRank declared in taxonomies/evidence-kinds.yaml, not by list position.
                  enum: [inferred, observed, validated, curated, usage-proven]
                includeCounterEvidence: { type: boolean, default: true }
                tokenBudget: { type: integer, minimum: 256, maximum: 32000 }
      responses:
        '200':
          description: Ranked intelligence bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetrievalBundle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /read-plans/validate:
    post:
      operationId: validateReadPlan
      summary: Validate a typed read plan against authorization, policy, source version, evidence, and cost.
      security:
        - oidc: [data.read]
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan, parameters]
              properties:
                plan: { $ref: ./read-plan.schema.json }
                parameters: { type: object, maxProperties: 100 }
      responses:
        '200':
          description: Validation receipt; no source operation has executed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadPlanValidationReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
        '409': { $ref: '#/components/responses/Problem' }
  /read-plans/{planId}/execute:
    post:
      operationId: executeValidatedReadPlan
      summary: Execute a plan only when its unexpired validation receipt matches the current caller and source version.
      security:
        - oidc: [data.read]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [validationReceiptId, planHash, parameterValuesHash, parameters]
              properties:
                validationReceiptId: { type: string, format: uuid }
                planHash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                parameterValuesHash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                parameters: { type: object, maxProperties: 100 }
      responses:
        '200':
          description: Bounded read result with execution receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadExecutionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /sources/{sourceId}/lifecycle-requests:
    post:
      operationId: requestSourceRevocationOrDeletion
      summary: Block serving immediately and request revocation or derived-data deletion.
      security:
        - oidc: [source.delete]
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { enum: [revoke-serving, delete-derived-data, delete-source-registration] }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '202':
          description: Serving blocked and lifecycle request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [requestId, statusUrl]
                properties:
                  requestId: { type: string, format: uuid }
                  statusUrl: { type: string, format: uri-reference }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /lifecycle-requests/{requestId}:
    get:
      operationId: getSourceLifecycleReceipt
      summary: Get the per-derived-store revocation or deletion receipt.
      security:
        - oidc: [source.delete]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Lifecycle receipt.
          content:
            application/json:
              schema: { $ref: ./deletion-receipt.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
  /evidence/{evidenceId}/feedback:
    post:
      operationId: recordEvidenceFeedback
      summary: Record append-only human or agent feedback without overwriting the original evidence.
      security:
        - oidc: [evidence.review]
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason, sourceVersion, evidenceVersionHash, reviewPolicyId, reviewPolicyVersion]
              properties:
                decision: { enum: [confirm, reject, supersede, request-revalidation] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
                sourceVersion: { type: string, minLength: 1 }
                evidenceVersionHash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                reviewPolicyId: { type: string, minLength: 1 }
                reviewPolicyVersion: { type: string, minLength: 1 }
      responses:
        '201':
          description: Feedback evidence created idempotently.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: ./feedback-receipt.schema.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProtectedResourceUnavailable' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.invalid/.well-known/openid-configuration
      description: The service validates issuer, audience, expiry, subject, tenant, and delegated or service scopes; authorization scope is derived from claims, never request fields.
  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceVersion:
      name: sourceVersion
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    ManifestVersion:
      name: manifestVersion
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    TraceId:
      name: traceparent
      in: header
      required: false
      schema: { type: string, maxLength: 100 }
  schemas:
    AcceptedRun:
      type: object
      additionalProperties: false
      required: [sourceId, runId, statusUrl]
      properties:
        sourceId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        statusUrl: { type: string, format: uri-reference }
    RetrievalBundle:
      $ref: ./retrieval-bundle.schema.json
    ProfileManifest:
      $ref: ./profile-manifest.schema.json
    CapabilityManifest:
      $ref: ./capability-manifest.schema.json
    EvidenceResponse:
      $ref: ./evidence-response.schema.json
    ReadPlanValidationReceipt:
      $ref: ./read-plan-validation-receipt.schema.json
    ReadExecutionResult:
      $ref: ./read-execution-result.schema.json
    SafeProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, reasonCode, traceId]
      properties:
        type: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        reasonCode: { type: string, pattern: '^[A-Z0-9_-]{2,64}$' }
        traceId: { type: string, maxLength: 100 }
        detail:
          description: Null or a fixed service-authored phrase; runtime source values, identifiers, locators, queries, stack traces, and internal paths are forbidden.
          enum: [null, Request rejected., Request conflicts with current state., Request limit exceeded.]
    ProtectedResourceProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, reasonCode, traceId, detail]
      properties:
        type: { const: 'urn:agent-data-profiler:resource-unavailable' }
        title: { const: Resource unavailable }
        status: { const: 404 }
        reasonCode: { const: RESOURCE_UNAVAILABLE }
        traceId: { type: string, minLength: 1, maxLength: 100 }
        detail: { type: 'null' }
  responses:
    Unauthorized:
      description: Authentication is missing, invalid, expired, or has the wrong audience or issuer.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SafeProblem' }
    Forbidden:
      description: The caller is authenticated but is not authorized; the response does not enumerate protected resources.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SafeProblem' }
    ProtectedResourceUnavailable:
      description: The protected resource is absent or inaccessible. Both states return this identical body shape and equivalent observable behavior.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProtectedResourceProblem' }
    RateLimited:
      description: Per-principal, source, or tenant admission limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SafeProblem' }
    Problem:
      description: Problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SafeProblem' }
